# Stage 2: full run. All 26 layers, 20M training tokens, each read once.
# To add tokens after reading the results, run an extension (scripts/stage2_extend.sh):
# it continues these projections and this data stream, so no token is read twice.
run:
  name: stage2_full
  experiment: stage2_full
  tokens: 20_000_000
eval:
  every_steps: 100      # about 9 subset evaluations over 915 end-to-end steps: the curve that decides on more tokens
