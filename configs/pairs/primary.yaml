# Primary pair: Gemma 3 1B (dense, Model A) receives MobileMoE-M-Base's MoE blocks (Model B).
# Both have 26 layers, so A layer i borrows B layer i.
pair:
  a:
    model_id: google/gemma-3-1b-pt      # gated: accept Google's Gemma terms on Hugging Face
    revision: null
    num_layers: 26
    hidden_size: 1152
    ffn_hidden: 6912
  b:
    model_id: facebook/MobileMoE-M-Base  # gated: share contact info on Hugging Face; FAIR NC license
    revision: f231740144b18f980fc1d7cce0ba60eb6f08b446   # the commit inspected at M0 (6 Oct 2026); pins its custom code
    trust_remote_code: true
    num_layers: 26
    hidden_size: 1024
    num_experts: 60
    top_k: 4
    # Module names inside MobileMoE's custom code, as `transplant inspect` found them at M0
    # (runs/m0/m0_inspect.json, 6 Oct 2026). "auto" would discover them again.
    layers_path: model.layers
    moe_attr: feed_forward             # MobileMoETextMoe: per-expert loop over the tokens routed to it (dropless)
    norm_attr: post_attention_layernorm  # B's RMSNorm in front of the MoE block (N_B)
    router_attr: router
    shared_attr: shared_expert
    moe_forward: bucketed    # bucketed | grouped | native. MobileMoE's own per-expert loop gives the Apple GPU
                             # a new tensor shape on every call; bucketed and grouped compute the same thing
                             # with few shapes (grouped: one batched product for all experts; compare with memcheck)
  layers: all                # every Gemma layer (int, list, "middle:K", "first:K", "last:K" also accepted)
  layer_map: relative_depth  # relative_depth | offset:K | fixed:J (ablation AB4)
